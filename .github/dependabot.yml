version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - type:operations
      - department:security-release
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
    labels:
      - type:operations
      - department:security-release

